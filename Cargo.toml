[package]
name = "zero2prod"
version = "0.1.0"
authors = ["Benedek Juhász <juhasz.benedek14@gmail.com>"]
edition = "2024"

[lib]
path = "src/lib.rs"

[[bin]]
path = "src/main.rs"
name = "zero2prod"

[dependencies]
axum = "0.8.9"
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.54.1", features = ["full"] }

[dev-dependencies]
reqwest = "0.13.5"
tower = { version = "0.5.3", features = ["util"] }
